# ============================================================================
# qwen35 合并视频 stage（Barrett `stage3_date0821_img38_video62.yaml` 的 MAVERIC 路径移植）
# 2026-09-12。配比、每条权重与原文件逐条相同（权重 = 各 part 真实 bin 数，即每个源各过 1 epoch）：
#   图像 SFT                      367,243 bins  38.0%
#   180s 长视频 (10 part)         180,204 bins  18.6%
#   pandas70m dynD 五分桶 (88)    382,524 bins  39.6%
#   shortmix_3sets (10)            34,200 bins   3.5%
#   Timelens (1)                    2,081 bins   0.2%
#   合计                          966252 bins;  GBS 32 → 1 epoch = 30195 iter (GBS 240 → 4026)
#
# !!! 缺口（必须记住）：原配方图像侧是 `/ov21/ov21sft_56m_packed_L64k/part00..09`（56m SFT 前 10 part），
#     集群上没有（09-12 全盘 find '*56m*' '*ov21sft*' 零命中）。这里暂用 final_round 的 47m_v3 顶替，
#     总权重与原 56m 块相同以保住 38%。47m_v3 是 OCR/文档偏向的 final-SFT 集（每 bin 4 张单图，~16k tok/样本），
#     与 56m 广谱 SFT 不是同一分布 —— 拿到 56m 后把下面 18 条 shard 换回 10 条 part 即可，其余不动。
#     备选顶替：stage-4 pool `47m_sft_packed_64k/47m_part1..7`（A800 广谱集，147,480 bins，需 ×2.5 权重）、
#     `final_round/dataset_sft_image/spatial_gui_64k_shuffled_502w`（GUI/空间类）。
#
# 路径映射（目录层级与原文件相同，只换前缀）：
#   /ov21/pandas70m_*                → /datasets/feilong-stage4-datasets/pandas70m_*      （48 卡表单已挂）
#   /ov21/all_180s_96w_packed_64k/180s_partN → /datasets/180s-partN-<suffix>              （需补挂 10 个目录）
#   /ov21/shortmix_*, /ov21/Timelens_* → /datasets/feilong-stage3-datasets/dataset/…      （需补挂）
#   注意 /datasets/180s_96w_packed_64k 只有 part0，是残缺拷贝，不能用。
#
# 运行前提（同 merged_s23_img30.yaml 头部）：64k pack ⇒ OV2_SEQ_LEN=73728；TP1 装不下，TP4 HybridEP cap 恰好压线；
#   pandas dynD bin 内含 47m 单图 topup（Barrett 注释 + 08-13 实测 1 张 SFT 图/bin），图像 token 实际略高于 38%。
# ============================================================================
